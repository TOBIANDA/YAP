<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jam Digital & Analog Estetik</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #eaf2fd;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --border: rgba(215, 230, 252, 0.9);
      --shadow: 0 16px 36px rgba(37, 99, 235, 0.12);
    }
    body.dark {
      --bg: #0b132b;
      --card: #1c2541;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #60a5fa;
      --accent-soft: #1e3a8a;
      --border: rgba(255, 255, 255, 0.1);
      --shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s, color 0.3s; }
    body { background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; user-select: none; }
    .clock-card { background: var(--card); border-radius: 36px; padding: 28px 24px; width: 100%; max-width: 360px; box-shadow: var(--shadow); border: 1.5px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 20px; }
    .top-row { width: 100%; display: flex; justify-content: space-between; align-items: center; }
    .app-badge { font-size: 12px; font-weight: 800; background: var(--accent-soft); color: var(--accent); padding: 5px 14px; border-radius: 9999px; display: flex; align-items: center; gap: 6px; }
    .icon-toggle { background: transparent; border: none; font-size: 18px; color: var(--muted); cursor: pointer; padding: 4px; }
    /* Analog Clock */
    .analog-clock { width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--accent-soft); position: relative; background: radial-gradient(circle, var(--card) 60%, var(--accent-soft) 100%); box-shadow: inset 0 2px 8px rgba(0,0,0,0.06); }
    .center-pin { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; }
    .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom center; border-radius: 4px; }
    .hand.hour { width: 4px; height: 38px; background: var(--text); margin-left: -2px; }
    .hand.minute { width: 3px; height: 52px; background: var(--accent); margin-left: -1.5px; }
    .hand.second { width: 1.5px; height: 62px; background: #ef4444; margin-left: -0.75px; }
    /* Digital Time */
    .digital-box { text-align: center; }
    .digital-time { font-family: 'JetBrains Mono', monospace; font-size: 40px; font-weight: 800; color: var(--text); letter-spacing: -1px; line-height: 1; }
    .ampm { font-size: 16px; font-weight: 700; color: var(--accent); margin-left: 4px; }
    .date-label { font-size: 13.5px; font-weight: 600; color: var(--muted); margin-top: 8px; }
    /* Timezone pills */
    .tz-pills { display: flex; gap: 6px; width: 100%; justify-content: center; }
    .tz-btn { border: none; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 11px; padding: 6px 14px; border-radius: 9999px; cursor: pointer; transition: all 0.2s; }
    .tz-btn.active { background: var(--accent); color: #ffffff; }
    /* Alarm Section */
    .alarm-box { width: 100%; background: var(--bg); border-radius: 20px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
    .alarm-left { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--text); }
    .alarm-time-input { border: 1px solid #cbd5e1; border-radius: 8px; padding: 4px 8px; font-family: inherit; font-size: 12px; font-weight: 700; background: var(--card); color: var(--text); outline: none; }
    .alarm-toggle { width: 38px; height: 22px; border-radius: 11px; background: #cbd5e1; position: relative; cursor: pointer; transition: background 0.3s; }
    .alarm-toggle.on { background: var(--accent); }
    .alarm-thumb { width: 18px; height: 18px; border-radius: 50%; background: white; position: absolute; top: 2px; left: 2px; transition: transform 0.3s; }
    .alarm-toggle.on .alarm-thumb { transform: translateX(16px); }
  </style>
</head>
<body>
  <div class="clock-card">
    <div class="top-row">
      <div class="app-badge"><i class="fa-solid fa-clock"></i> JAM STUDIO</div>
      <button class="icon-toggle" onclick="toggleTheme()" title="Ubah Tema"><i class="fa-solid fa-moon" id="theme-icon"></i></button>
    </div>

    <!-- Analog Clock -->
    <div class="analog-clock">
      <div class="center-pin"></div>
      <div class="hand hour" id="hour-hand"></div>
      <div class="hand minute" id="min-hand"></div>
      <div class="hand second" id="sec-hand"></div>
    </div>

    <!-- Digital Clock -->
    <div class="digital-box">
      <div class="digital-time">
        <span id="dig-time">00:00:00</span><span class="ampm" id="dig-ampm"></span>
      </div>
      <div class="date-label" id="dig-date">Memuat tanggal...</div>
    </div>

    <!-- Timezones -->
    <div class="tz-pills">
      <button class="tz-btn active" onclick="setTz(0, this)">WIB</button>
      <button class="tz-btn" onclick="setTz(1, this)">WITA</button>
      <button class="tz-btn" onclick="setTz(2, this)">WIT</button>
      <button class="tz-btn" onclick="setTz(-7, this)">London</button>
      <button class="tz-btn" onclick="setTz(2, this)">Tokyo</button>
    </div>

    <!-- Alarm Box -->
    <div class="alarm-box">
      <div class="alarm-left">
        <i class="fa-solid fa-bell"></i>
        <span>Alarm</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <input type="time" id="alarm-time" class="alarm-time-input" value="07:00">
        <div class="alarm-toggle" id="alarm-toggle" onclick="toggleAlarm()">
          <div class="alarm-thumb"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let tzOffset = 0;
    let alarmOn = false;
    let is24 = true;
    const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

    function updateClock() {
      const now = new Date();
      const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      const targetTime = new Date(utc + (3600000 * (7 + tzOffset)));

      const h = targetTime.getHours();
      const m = targetTime.getMinutes();
      const s = targetTime.getSeconds();

      const degH = (h % 12) * 30 + m * 0.5;
      const degM = m * 6;
      const degS = s * 6;
      document.getElementById('hour-hand').style.transform = 'rotate(' + degH + 'deg)';
      document.getElementById('min-hand').style.transform = 'rotate(' + degM + 'deg)';
      document.getElementById('sec-hand').style.transform = 'rotate(' + degS + 'deg)';

      const dispH = is24 ? String(h).padStart(2, '0') : String(h % 12 || 12).padStart(2, '0');
      const dispM = String(m).padStart(2, '0');
      const dispS = String(s).padStart(2, '0');
      document.getElementById('dig-time').textContent = dispH + ':' + dispM + ':' + dispS;
      document.getElementById('dig-ampm').textContent = is24 ? '' : (h >= 12 ? ' PM' : ' AM');

      const dayName = days[targetTime.getDay()];
      const monthName = months[targetTime.getMonth()];
      document.getElementById('dig-date').textContent = dayName + ', ' + targetTime.getDate() + ' ' + monthName + ' ' + targetTime.getFullYear();

      if (alarmOn) {
        const alarmVal = document.getElementById('alarm-time').value;
        const curHM = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
        if (alarmVal === curHM && s === 0) {
          playAlarmChime();
        }
      }
    }

    function setTz(offset, btn) {
      tzOffset = offset;
      document.querySelectorAll('.tz-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateClock();
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
      const icon = document.getElementById('theme-icon');
      icon.className = document.body.classList.contains('dark') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    }

    function toggleAlarm() {
      alarmOn = !alarmOn;
      const t = document.getElementById('alarm-toggle');
      if (alarmOn) { t.classList.add('on'); } else { t.classList.remove('on'); }
    }

    function playAlarmChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        for (let i = 0; i < 4; i++) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(880, ctx.currentTime + i * 0.25);
          gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.25);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.25 + 0.18);
          osc.start(ctx.currentTime + i * 0.25);
          osc.stop(ctx.currentTime + i * 0.25 + 0.18);
        }
      } catch (e) {}
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
